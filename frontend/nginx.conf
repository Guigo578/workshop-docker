server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------
    # Arquivos estáticos (o dashboard / painel de status)
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # PROXY REVERSO (a peça-chave para funcionar no Codespaces)
    # O navegador chama o caminho relativo "/api/..." (mesma origem
    # da página) e o Nginx repassa internamente para o serviço
    # "backend" pela rede do Docker. Assim não há localhost,
    # mixed content (http x https) nem CORS, e basta UMA porta pública.
    # ------------------------------------------------------------
    location /api/ {
        # DNS interno do Docker. Usar uma VARIÁVEL ($backend) obriga o
        # Nginx a resolver o nome só na hora da requisição. Sem isso, o
        # Nginx se recusaria a iniciar na Fase 1, quando o serviço
        # "backend" ainda está comentado e não existe na rede.
        resolver 127.0.0.11 valid=5s;
        set $backend backend;
        proxy_pass http://$backend:3000$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Se o backend estiver fora, falha rápido para o dashboard
        # mostrar "OFFLINE" sem travar a interface.
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }
}
